# ==============================================================================
# BWP-Notebook-v2 CI/CD Pipeline
# Customized & Architecture by IT Leon (BWP Engineering Team)
# Base Platform: Plane CE v1.4.2 (Makeplane Inc., AGPL-3.0)
# ==============================================================================

name: BWP-Notebook-v2 CI/CD

on:
  push:
    branches:
      - nora/main
      - main
  pull_request:
    branches:
      - nora/main
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-check:
    name: Lint, Typecheck and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Docker Compose Configurations
        run: |
          python3 -c "
          import yaml
          for path in ['docker-compose.prod.yml']:
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      yaml.safe_load(f)
                  print(f'Valid YAML: {path}')
              except Exception as e:
                  print(f'Error reading {path}: {e}')
                  exit(1)
          "

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: |
          pnpm exec oxfmt --check .
          pnpm exec oxlint --deny-warnings packages/ apps/web/app/root.tsx

  docker:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: lint-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/nora/main' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
