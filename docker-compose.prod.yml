# ==============================================================================
# BWP-Notebook-v2 Production Docker Compose
# Customized & Architecture by IT Leon (BWP Engineering Team)
# Target Server: Debian 192.168.3.168 (Dodge port collisions)
# Base Platform: Plane CE v1.4.2
# ==============================================================================

version: '3.8'

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: ${POSTGRES_DB:-bwp_plane}
  POSTGRES_USER: ${POSTGRES_USER:-bwp_plane_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bwp_secret_pw_2026}
  POSTGRES_DB: ${POSTGRES_DB:-bwp_plane}
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-bwp_minio_access}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-bwp_minio_secret_key_2026}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-bwp_minio_access}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-bwp_minio_secret_key_2026}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-bwp-notebook-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-192.168.3.168:18080}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-18080}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-18443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-bwp-notebook-uploads}
  SITE_ADDRESS: :80

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bwp_mq}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bwp_mq_password_2026}
  RABBITMQ_DEFAULT_VHOST: bwp_plane
  RABBITMQ_VHOST: bwp_plane

x-live-env: &live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-bwp-live-secret-key-2026}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://192.168.3.168:18080}
  DEBUG: 0
  CORS_ALLOWED_ORIGINS: ${WEB_URL:-http://192.168.3.168:18080}
  GUNICORN_WORKERS: 1
  USE_MINIO: 1
  DATABASE_URL: postgresql://${POSTGRES_USER:-bwp_plane_user}:${POSTGRES_PASSWORD:-bwp_secret_pw_2026}@plane-db:5432/${POSTGRES_DB:-bwp_plane}
  SECRET_KEY: ${SECRET_KEY:-bwp-notebook-secret-key-super-secure-2026}
  AMQP_URL: amqp://${RABBITMQ_USER:-bwp_mq}:${RABBITMQ_PASSWORD:-bwp_mq_password_2026}@plane-mq:5672/bwp_plane
  API_KEY_RATE_LIMIT: 60/minute
  MINIO_ENDPOINT_SSL: 0
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-bwp-live-secret-key-2026}

services:
  plane-db:
    container_name: bwp_notebook_plane_db
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=200'
    environment:
      <<: *db-env
    volumes:
      - bwp_plane_pgdata:/var/lib/postgresql/data
    networks:
      - bwp_notebook_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bwp_plane_user} -d ${POSTGRES_DB:-bwp_plane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  plane-redis:
    container_name: bwp_notebook_plane_redis
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - bwp_plane_redisdata:/data
    networks:
      - bwp_notebook_net

  plane-mq:
    container_name: bwp_notebook_plane_mq
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - bwp_plane_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bwp_notebook_net

  plane-minio:
    container_name: bwp_notebook_plane_minio
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - bwp_plane_uploads:/export
    networks:
      - bwp_notebook_net

  migrator:
    container_name: bwp_notebook_plane_migrator
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - bwp_plane_logs_migrator:/code/plane/logs
      - ./custom_backend/apps/api/plane/db/models/issue.py:/code/plane/db/models/issue.py
      - ./custom_backend/apps/api/plane/db/models/issue_type.py:/code/plane/db/models/issue_type.py
      - ./custom_backend/apps/api/plane/db/models/state.py:/code/plane/db/models/state.py
      - ./custom_backend/apps/api/plane/db/models/__init__.py:/code/plane/db/models/__init__.py
      - ./custom_backend/apps/api/plane/db/migrations/0123_issue_supporters_room_notes.py:/code/plane/db/migrations/0123_issue_supporters_room_notes.py
      - ./custom_backend/apps/api/plane/db/management/commands/seed_task_types.py:/code/plane/db/management/commands/seed_task_types.py
      - ./custom_backend/apps/api/plane/app/serializers/issue.py:/code/plane/app/serializers/issue.py
      - ./custom_backend/apps/api/plane/app/serializers/__init__.py:/code/plane/app/serializers/__init__.py
      - ./custom_backend/apps/api/plane/app/views/issue/base.py:/code/plane/app/views/issue/base.py
      - ./custom_backend/apps/api/plane/bgtasks/issue_activities_task.py:/code/plane/bgtasks/issue_activities_task.py
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    networks:
      - bwp_notebook_net
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started

  api:
    container_name: bwp_notebook_plane_api
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - bwp_plane_logs_api:/code/plane/logs
      - ./custom_backend/apps/api/plane/db/models/issue.py:/code/plane/db/models/issue.py
      - ./custom_backend/apps/api/plane/db/models/issue_type.py:/code/plane/db/models/issue_type.py
      - ./custom_backend/apps/api/plane/db/models/state.py:/code/plane/db/models/state.py
      - ./custom_backend/apps/api/plane/db/models/__init__.py:/code/plane/db/models/__init__.py
      - ./custom_backend/apps/api/plane/db/migrations/0123_issue_supporters_room_notes.py:/code/plane/db/migrations/0123_issue_supporters_room_notes.py
      - ./custom_backend/apps/api/plane/db/management/commands/seed_task_types.py:/code/plane/db/management/commands/seed_task_types.py
      - ./custom_backend/apps/api/plane/app/serializers/issue.py:/code/plane/app/serializers/issue.py
      - ./custom_backend/apps/api/plane/app/serializers/__init__.py:/code/plane/app/serializers/__init__.py
      - ./custom_backend/apps/api/plane/app/views/issue/base.py:/code/plane/app/views/issue/base.py
      - ./custom_backend/apps/api/plane/bgtasks/issue_activities_task.py:/code/plane/bgtasks/issue_activities_task.py
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    networks:
      - bwp_notebook_net
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  worker:
    container_name: bwp_notebook_plane_worker
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - bwp_plane_logs_worker:/code/plane/logs
      - ./custom_backend/apps/api/plane/db/models/issue.py:/code/plane/db/models/issue.py
      - ./custom_backend/apps/api/plane/db/models/issue_type.py:/code/plane/db/models/issue_type.py
      - ./custom_backend/apps/api/plane/db/models/state.py:/code/plane/db/models/state.py
      - ./custom_backend/apps/api/plane/db/models/__init__.py:/code/plane/db/models/__init__.py
      - ./custom_backend/apps/api/plane/db/migrations/0123_issue_supporters_room_notes.py:/code/plane/db/migrations/0123_issue_supporters_room_notes.py
      - ./custom_backend/apps/api/plane/db/management/commands/seed_task_types.py:/code/plane/db/management/commands/seed_task_types.py
      - ./custom_backend/apps/api/plane/app/serializers/issue.py:/code/plane/app/serializers/issue.py
      - ./custom_backend/apps/api/plane/app/serializers/__init__.py:/code/plane/app/serializers/__init__.py
      - ./custom_backend/apps/api/plane/app/views/issue/base.py:/code/plane/app/views/issue/base.py
      - ./custom_backend/apps/api/plane/bgtasks/issue_activities_task.py:/code/plane/bgtasks/issue_activities_task.py
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    networks:
      - bwp_notebook_net
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    container_name: bwp_notebook_plane_beat_worker
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - bwp_plane_logs_beat_worker:/code/plane/logs
      - ./custom_backend/apps/api/plane/db/models/issue.py:/code/plane/db/models/issue.py
      - ./custom_backend/apps/api/plane/db/models/issue_type.py:/code/plane/db/models/issue_type.py
      - ./custom_backend/apps/api/plane/db/models/state.py:/code/plane/db/models/state.py
      - ./custom_backend/apps/api/plane/db/models/__init__.py:/code/plane/db/models/__init__.py
      - ./custom_backend/apps/api/plane/db/migrations/0123_issue_supporters_room_notes.py:/code/plane/db/migrations/0123_issue_supporters_room_notes.py
      - ./custom_backend/apps/api/plane/db/management/commands/seed_task_types.py:/code/plane/db/management/commands/seed_task_types.py
      - ./custom_backend/apps/api/plane/app/serializers/issue.py:/code/plane/app/serializers/issue.py
      - ./custom_backend/apps/api/plane/app/serializers/__init__.py:/code/plane/app/serializers/__init__.py
      - ./custom_backend/apps/api/plane/app/views/issue/base.py:/code/plane/app/views/issue/base.py
      - ./custom_backend/apps/api/plane/bgtasks/issue_activities_task.py:/code/plane/bgtasks/issue_activities_task.py
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    networks:
      - bwp_notebook_net
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  web:
    container_name: bwp_notebook_plane_web
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    networks:
      - bwp_notebook_net
    depends_on:
      - api

  admin:
    container_name: bwp_notebook_plane_admin
    image: makeplane/plane-admin:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    networks:
      - bwp_notebook_net
    depends_on:
      - api
      - web

  space:
    container_name: bwp_notebook_plane_space
    image: makeplane/plane-space:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    networks:
      - bwp_notebook_net
    depends_on:
      - api
      - web

  live:
    container_name: bwp_notebook_plane_live
    image: makeplane/plane-live:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    networks:
      - bwp_notebook_net
    depends_on:
      - api
      - web

  proxy:
    container_name: bwp_notebook_plane_proxy
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    environment:
      <<: *proxy-env
    ports:
      - "${LISTEN_HTTP_PORT:-18080}:80"
    volumes:
      - bwp_plane_proxy_config:/config
      - bwp_plane_proxy_data:/data
    networks:
      - bwp_notebook_net
    depends_on:
      - web
      - api
      - space
      - admin
      - live

networks:
  bwp_notebook_net:
    name: bwp_notebook_net

volumes:
  bwp_plane_pgdata:
  bwp_plane_redisdata:
  bwp_plane_uploads:
  bwp_plane_rabbitmq_data:
  bwp_plane_logs_api:
  bwp_plane_logs_worker:
  bwp_plane_logs_beat_worker:
  bwp_plane_logs_migrator:
  bwp_plane_proxy_config:
  bwp_plane_proxy_data:
